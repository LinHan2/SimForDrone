# SimForDrone 双机开放网格场景超参数。修改后必须重启 Isaac 场景才会生效。
# 可用 SIMFORDRONE_CONFIG=/absolute/path/experiment.yaml 切换到另一组实验参数。

px4:
  # Pegasus 中 PX4 归一化执行器输出到转子角速度的增益；环境变量可单次覆盖它。
  rotor_input_scaling: 2000.0

vehicles:
  target:
    vehicle_id: 0
    stage_path: /World/target_uav
    initial_position: [3.0, 0.0, 2.0]
    ros_namespace: target_uav_
  tracker:
    vehicle_id: 1
    stage_path: /World/tracker_uav
    initial_position: [-3.0, 0.0, 2.0]
    ros_namespace: tracker_uav_

observer_camera:
  name: front_camera
  depth: true
  position: [0.30, 0.0, 0.0]
  orientation_deg: [0.0, 0.0, 180.0]
  resolution: [1280, 720]
  frequency_hz: 30.0
  intrinsics: [[640.0, 0.0, 640.0], [0.0, 640.0, 360.0], [0.0, 0.0, 1.0]]
  diagonal_fov_deg: 100.0

viewport:
  position: [10.0, -10.0, 7.0]
  target: [0.0, 0.0, 1.5]

environment:
  # 官方 Isaac Sim 室内环境预设名，取自 Pegasus 的 SIMULATION_ENVIRONMENTS 表
  # （路径随 Isaac 版本由上游给出，不在这里写死 Assets/Isaac/5.1）。
  #
  # 注意：Grid/default_environment.usd 是**空网格**：没有物体、光照也不足，
  # 只适合飞控真值试验，不能用于图像闭环。图像闭环必须使用有物体的室内环境。
  # 可切换的仓库类预设：Warehouse / Warehouse with Forklifts /
  # Warehouse with Shelves / Full Warehouse，也可改用 asset_url 指向自定义 USD。
  # preset 与 asset_url 只能二选一。
  preset: Full Warehouse
  asset_url:
  prim_path: /World/layout
  # 光照由 simfordrone.lighting 显式建立，不依赖环境资产自带的灯：
  # 环境光（dome）提供整体底光，太阳光（sun）给出方向感与阴影，
  # 天花板补光（rect_lights）把室内照度抬到可做视觉估计的水平。
  lighting:
    root: /World/lights
    dome:
      enabled: true
      intensity: 1000.0
      color: [1.0, 1.0, 1.0]
    sun:
      enabled: true
      intensity: 1500.0
      color: [1.0, 0.97, 0.92]
      angle_deg: 1.5
      elevation_deg: 55.0
      azimuth_deg: 135.0
    rect_lights:
      - prim_path: /World/lights/fill_south
        intensity: 900.0
        color: [0.95, 0.97, 1.0]
        size: [8.0, 8.0]
        position: [-4.0, -4.0, 6.0]
      - prim_path: /World/lights/fill_north
        intensity: 900.0
        color: [0.95, 0.97, 1.0]
        size: [8.0, 8.0]
        position: [4.0, 4.0, 6.0]
